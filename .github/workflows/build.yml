name: Bygg APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sorter filene i riktige mapper
        run: |
          mkdir -p app/src/main/java/no/henos/trippelwallet app/src/main/res/drawable
          mv app.build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv *.kt app/src/main/java/no/henos/trippelwallet/
          mv ic_app.xml app/src/main/res/drawable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TrippelWallet-apk
          path: app/build/outputs/apk/debug/app-debug.apk
